name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 同一 tag 重复推送/重跑时自动取消旧 run：
# 避免多个 mac 构建并行互相抢占、白白消耗 Actions 配额（这也是 dmg 反复被取消的常见诱因）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先建一个正式（非草稿）Release，供两个构建 job 上传产物，
  # 避免 win / mac 并发各自创建 Release 导致 409 冲突。
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 解析发布仓库（单一事实源 = package.json 的 build.publish，改名只改那一处）
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const pub=Array.isArray(p.build.publish)?p.build.publish[0]:p.build.publish; process.stdout.write('RELEASE_REPO=' + pub.owner + '/' + pub.repo + '\n')" >> "$GITHUB_ENV"
          echo "发布仓库: $RELEASE_REPO"
      - name: 校验 RELEASE_TOKEN 已配置
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret 未配置或为空！请到 lolo 仓库 Settings → Secrets and variables → Actions 新建名为 RELEASE_TOKEN 的 secret，值为一个具有 repo 权限的 classic PAT。"
            exit 1
          fi
          echo "RELEASE_TOKEN 已配置（长度 ${#GH_TOKEN}），继续。"
      - name: 生成发布说明
        run: |
          VER="${GITHUB_REF_NAME#v}"   # tag v1.0.4 -> 1.0.4
          cat > release-notes.md <<'EOF'
          ## 下载对应你系统的版本 / Pick your platform

          | 平台 Platform | 文件 File | 说明 Notes |
          | --- | --- | --- |
          | Windows 10 / 11 | `lolo-desktop-pet-setup-__VER__.exe` | 安装版，**支持自动更新** Installer with auto-update |
          | Windows 10 / 11 | `lolo-desktop-pet-__VER__.exe` | 便携版，免安装、不自动更新 Portable, no auto-update |
          | Windows 7 | `lolo-desktop-pet-win7-x64.exe` / `lolo-desktop-pet-win7-ia32.exe` | 老系统专版（32 位选 ia32）Legacy build |
          | macOS（Intel 芯片） | `lolo-desktop-pet-__VER__-x64.dmg` | 未签名 Unsigned |
          | macOS（Apple 芯片 M 系列） | `lolo-desktop-pet-__VER__-arm64.dmg` | 未签名 Unsigned |

          **不确定 Mac 是哪种芯片？** 左上角苹果菜单  →「关于本机 About This Mac」：
          看到 **Intel** 下 `-x64.dmg`，看到 **Apple M1/M2/M3/M4** 下 `-arm64.dmg`。

          **Mac 首次打开**（未签名应用）：不要双击，在 dmg 上**右键 → 打开**；
          若提示“已损坏 / damaged”，在终端执行 `xattr -cr /Applications/lolo-desktop-pet.app` 后重开。
          On macOS: right-click the dmg → **Open**. If it says "damaged", run
          `xattr -cr /Applications/lolo-desktop-pet.app` in Terminal.

          **首次使用请看** 👉 `lolo-使用说明-User-Guide.md`（中英双语完整手册，软件内「面板 → 使用说明」也有同样内容）。

          **See the User Guide** 👉 `lolo-使用说明-User-Guide.md` — bilingual manual (Chinese + English). The same guide is built into the app under Panel → User Guide.

          **国内用户：页面打不开 / 下载卡住？** 直接用下面的免代理下载直链
          （反代只支持文件、不支持网页；Mac 请用 Chrome/Edge 或终端 `curl -L`，不要用 Safari）：

          - Windows 10/11 安装版：https://ghfast.top/https://github.com/__REPO__/releases/download/v__VER__/lolo-desktop-pet-setup-__VER__.exe
          - Windows 10/11 便携版：https://ghfast.top/https://github.com/__REPO__/releases/download/v__VER__/lolo-desktop-pet-__VER__.exe
          - macOS (Intel 芯片)：https://ghfast.top/https://github.com/__REPO__/releases/download/v__VER__/lolo-desktop-pet-__VER__-x64.dmg
          - macOS (Apple M 系列)：https://ghfast.top/https://github.com/__REPO__/releases/download/v__VER__/lolo-desktop-pet-__VER__-arm64.dmg
          - Windows 7 (64位)：https://ghfast.top/https://github.com/__REPO__/releases/download/v__VER__/lolo-desktop-pet-win7-x64.exe
          - Windows 7 (32位)：https://ghfast.top/https://github.com/__REPO__/releases/download/v__VER__/lolo-desktop-pet-win7-ia32.exe

          **想永久收藏、永远下到最新版？** 直接用下面这组"稳定直链"（链接里不带版本号，始终指向最新 Release）：
          - Win 安装版：https://ghfast.top/https://github.com/__REPO__/releases/latest/download/lolo-win-setup.exe
          - Win 便携版：https://ghfast.top/https://github.com/__REPO__/releases/latest/download/lolo-win-portable.exe
          - Mac Intel：https://ghfast.top/https://github.com/__REPO__/releases/latest/download/lolo-mac-intel.dmg
          - Mac Apple M：https://ghfast.top/https://github.com/__REPO__/releases/latest/download/lolo-mac-apple.dmg
          - Win7 x64：https://ghfast.top/https://github.com/__REPO__/releases/latest/download/lolo-win7-x64.exe
          - Win7 32位：https://ghfast.top/https://github.com/__REPO__/releases/latest/download/lolo-win7-ia32.exe

          （备用前缀：ghproxy.net / mirror.ghproxy.com，拼法相同：`前缀 + 原 github 文件链接`）
          EOF
          sed -i "s/__VER__/${VER}/g" release-notes.md
          sed -i "s|__REPO__|${RELEASE_REPO}|g" release-notes.md
          echo "发布说明已生成（版本 ${VER}）"
          cat release-notes.md
      - name: 创建 GitHub Release（正式发布，非草稿，发布到公开仓库 lolo-pet）
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_REPO" ] || [[ "$RELEASE_REPO" == *undefined* ]]; then
            echo "::error::RELEASE_REPO 解析失败（=$RELEASE_REPO），请检查 package.json 的 build.publish[0].owner/repo"
            exit 1
          fi
          API="https://api.github.com/repos/$RELEASE_REPO/releases"
          # 幂等检查：已存在则跳过（避免重跑 workflow 时重复创建）
          EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/tags/$TAG")
          if [ "$EXISTS" = "200" ]; then
            echo "Release $TAG 已存在于 $RELEASE_REPO，跳过创建（幂等）。"
          else
            # 直接用 REST API 创建：只需 repo 权限，绕过 gh CLI 对 workflow scope 的强制校验
            # （gh release create 强制要求 workflow scope，而本仓库 RELEASE_TOKEN 仅含 repo scope）
            jq -n --arg tag "$TAG" --rawfile body release-notes.md \
              '{tag_name:$tag, name:$tag, body:$body, draft:false, prerelease:false, make_latest:"true"}' > payload.json
            HTTP=$(curl -s -o create-resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              --data-binary @payload.json \
              "$API")
            if [ "$HTTP" != "201" ]; then
              echo "::error::创建 Release 失败，HTTP $HTTP"; cat create-resp.json; exit 1
            fi
            echo "Release $TAG 已创建于 $RELEASE_REPO。"
          fi
      - name: 上传双语使用说明到 Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -f "docs/lolo-使用说明-User-Guide.md" ]; then
            gh release upload "${{ github.ref_name }}" "docs/lolo-使用说明-User-Guide.md" \
              --repo "$RELEASE_REPO" --clobber
            echo "说明书已上传"
          else
            echo "::warning::未找到 docs/lolo-使用说明-User-Guide.md，跳过上传"
          fi

  build-win:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 安装依赖
        run: npm ci
      - name: 构建并发布 Windows（portable + nsis 安装版）
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: 解析发布仓库（供别名上传）
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const pub=Array.isArray(p.build.publish)?p.build.publish[0]:p.build.publish; process.stdout.write('RELEASE_REPO=' + pub.owner + '/' + pub.repo + '\n')" >> "$GITHUB_ENV"
      - name: 上传"最新版"稳定别名（朋友永久收藏直链用，永远指向最新）
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          $setup = (Get-Item dist/lolo-desktop-pet-setup-*.exe | Select-Object -First 1).FullName
          $port  = (Get-Item dist/lolo-desktop-pet-*.exe | Where-Object { $_.Name -notlike '*setup*' } | Select-Object -First 1).FullName
          Copy-Item $setup lolo-win-setup.exe
          Copy-Item $port  lolo-win-portable.exe
          gh release upload "${{ github.ref_name }}" lolo-win-setup.exe lolo-win-portable.exe --repo "$RELEASE_REPO" --clobber

  build-mac:
    needs: create-release
    # runner 选型说明（踩过坑，勿随意改回 macos-latest）：
    #  · macos-latest 指向 Apple Silicon(arm64) runner，该池容量不足，job 会卡在
    #    "not acquired by Runner ... capacity constraints" 被取消，dmg 产不出。
    #  · macos-13(Intel x64) 已于 2025-12-04 退役：用退役标签不会报错，
    #    而是排队满 24 小时后才超时取消 —— 更难排查。
    #  · macos-15-intel 是当前唯一可用的 x86_64 macOS runner（2027-08 退役）。
    #  dmg 打包不依赖真机架构，x64 runner 可交叉产出 arm64 版 dmg。
    runs-on: macos-15-intel
    timeout-minutes: 45    # 退役/无可用 runner 时快速失败，不要排到 24h 才取消
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false   # 未签名，避免找不到证书报错退出
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 安装依赖
        run: npm ci
      - name: 构建并发布 macOS（dmg x64 + arm64，未签名）
        run: npx electron-builder --mac --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # 守门：确认两个架构的 dmg 文件名没有被 electron-builder 洗成同名。
      # 若有人把 mac.artifactName 改回含中文的名字，这里会红叉报警（详见脚本内注释）。
      - name: 校验 x64 / arm64 的 dmg 文件名互不冲突
        run: node build/verify-dmg-names.js
      - name: 解析发布仓库（供别名上传）
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const pub=Array.isArray(p.build.publish)?p.build.publish[0]:p.build.publish; process.stdout.write('RELEASE_REPO=' + pub.owner + '/' + pub.repo + '\n')" >> "$GITHUB_ENV"
      - name: 上传"最新版"稳定别名（朋友永久收藏直链用，永远指向最新）
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp "dist/lolo-desktop-pet-${VER}-x64.dmg"   lolo-mac-intel.dmg
          cp "dist/lolo-desktop-pet-${VER}-arm64.dmg" lolo-mac-apple.dmg
          gh release upload "${{ github.ref_name }}" lolo-mac-intel.dmg lolo-mac-apple.dmg --repo "$RELEASE_REPO" --clobber

  build-win7:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 解析发布仓库（单一事实源 = package.json 的 build.publish）
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const pub=Array.isArray(p.build.publish)?p.build.publish[0]:p.build.publish; process.stdout.write('RELEASE_REPO=' + pub.owner + '/' + pub.repo + '\n')" >> "$GITHUB_ENV"
          echo "发布仓库: $RELEASE_REPO"
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 安装依赖（主线 Electron 31）
        run: npm ci
      - name: 覆盖安装 Electron 22（最后一个官方支持 Win7/8.1 的版本）
        run: npm install --no-save electron@22
      - name: 构建 Win7 专版（portable，ia32 + x64，不发布、不抢 latest.yml）
        run: npx electron-builder --win --ia32 --x64 --config build/win7.json
      - name: 上传 Win7 专版到 Release（与主线 latest.yml 隔离，不参与自动更新）
        run: gh release upload ${{ github.ref_name }} "dist/lolo-desktop-pet-win7-x64.exe" "dist/lolo-desktop-pet-win7-ia32.exe" --repo "$RELEASE_REPO" --clobber
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: 上传"最新版"稳定别名（Win7，朋友永久收藏直链用）
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          Copy-Item "dist/lolo-desktop-pet-win7-x64.exe"  lolo-win7-x64.exe
          Copy-Item "dist/lolo-desktop-pet-win7-ia32.exe" lolo-win7-ia32.exe
          gh release upload "${{ github.ref_name }}" lolo-win7-x64.exe lolo-win7-ia32.exe --repo "$RELEASE_REPO" --clobber
